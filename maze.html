<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>数字赛车挑战 | Math Adventure</title>
<style>
:root{--ink:#253b40;--red:#c83236;--cream:#fff9ed;--green:#d9edc5;--line:#ded4c0;--muted:#5b6b67}*{box-sizing:border-box}body{margin:0;background:#f4efdf;color:var(--ink);font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",system-ui,sans-serif}button,select,input{font:inherit}button,select{cursor:pointer}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #126caa;outline-offset:3px}button:disabled{cursor:default;opacity:.5}a{color:inherit}header{max-width:1060px;margin:auto;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px}header a{text-decoration:none;font-weight:800}.brand{letter-spacing:.04em;color:#a62f31}main{max-width:1060px;margin:auto;padding:0 24px 30px}.hero{position:relative;overflow:hidden;background:#f9dca8;border:1px solid #e4c58f;border-radius:24px;min-height:165px;display:flex;align-items:center;padding:24px 30px;margin-bottom:18px}.hero-copy{position:relative;z-index:1;max-width:64%}.eyebrow{font-size:11px;letter-spacing:.16em;font-weight:900;color:#a13f2e}h1{font-size:clamp(25px,4vw,40px);line-height:1.15;margin:7px 0 9px;color:#9f272c}p{margin:0;line-height:1.6}.hero p{font-size:14px}.hero-art{position:absolute;right:0;bottom:0;width:47%;height:100%}.layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:18px;align-items:start}.panel{background:#fffdf7;border:1px solid var(--line);border-radius:21px;padding:20px;box-shadow:0 4px 0 #e2d8c3}.mission{display:flex;align-items:center;gap:15px;margin-bottom:14px}.mission h2{font-size:20px;margin:0 0 5px}.mission p{font-size:14px;color:var(--muted)}.target{flex-shrink:0;text-align:center;background:var(--red);color:white;padding:9px 14px;border-radius:14px;min-width:79px}.target small{display:block;font-size:11px}.target strong{font-size:34px;line-height:1.15}.guide{background:#f8efd9;border-radius:12px;padding:11px 13px;margin:0 0 15px;font-size:14px}.guide b{color:#8a482c}.board{display:grid;gap:5px;background:#cfcebe;border:5px solid #cfcebe;border-radius:14px;position:relative}.cell{position:relative;min-width:0;aspect-ratio:1.24;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;border:1px solid #e8e0d0;border-radius:8px;background:#fffefa;color:var(--ink);padding:3px 1px;touch-action:manipulation;transition:background .15s,box-shadow .15s}.cell .eq{font-weight:750;font-size:clamp(11px,2vw,19px);line-height:1.2;white-space:nowrap;letter-spacing:-.035em}.cell .mark{height:23px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#426e36}.cell .mark svg{width:36px;height:23px}.cell .mark:empty{display:none}.cell.next{box-shadow:inset 0 0 0 2px #b9a77e}.cell.trail{background:var(--green);border-color:#9ab681}.cell.current{background:var(--green);box-shadow:inset 0 0 0 3px #43813c;border-color:#43813c}.cell.current.start{background:#e4eef7;box-shadow:inset 0 0 0 3px #44729a;border-color:#44729a}.cell.wrong{background:#fce1df;box-shadow:inset 0 0 0 2px #c83236;border-color:#c83236}.cell .result{font-size:14px;font-weight:900;line-height:1;color:#32682c}.cell.wrong .result{color:#ac292b}.cell.goal .mark{color:#87611d}.cell:hover:not(:disabled){filter:brightness(.97)}.board[data-size="5"] .eq{font-size:clamp(10px,1.65vw,16px)}.board[data-size="6"] .eq{font-size:clamp(9px,1.45vw,14px)}.board[data-size="6"] .cell{aspect-ratio:1.04}.legend{display:flex;gap:15px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:10px 0}.legend span{display:flex;align-items:center;gap:5px}.swatch{width:12px;height:12px;border-radius:3px;border:1px solid #a9a38e;background:#fffefa}.swatch.green{background:var(--green)}.swatch.red{background:#fce1df;border-color:var(--red)}.swatch.start{background:#e4eef7;border-color:#44729a}.feedback{background:#f5f0e3;border-radius:12px;padding:13px 14px;min-height:64px;font-size:15px;line-height:1.55}.feedback.win,.feedback.correct{background:#e3f1d6;color:#315d2e;font-weight:800}.feedback.incorrect{background:#fce1df;color:#a02e2e;font-weight:750}.hint{margin-top:7px;color:#8b4d20;font-size:14px}.controls{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.btn{border:1px solid #c8bfad;border-radius:10px;background:white;color:var(--ink);padding:10px 13px;font-weight:750;min-height:42px}.primary{background:var(--red);color:white;border-color:var(--red)}.controls .btn{flex:1}.side h2{font-size:18px;margin:0 0 5px}.side p{font-size:13px;color:var(--muted)}label{display:block;font-size:13px;font-weight:750;margin:15px 0 6px}select{width:100%;padding:10px;border:1px solid #c8bfad;border-radius:9px;background:#fff;color:var(--ink)}.side .primary{width:100%;margin-top:18px}.side .note{margin-top:12px;font-size:12px}.stats{display:flex;justify-content:space-between;gap:6px;margin-top:18px;border-top:1px solid var(--line);padding-top:12px;font-size:12px;color:var(--muted)}.stats strong{display:block;color:var(--ink);font-size:21px}.error{color:#a02e2e;font-size:13px;margin-top:8px}footer{text-align:center;color:var(--muted);font-size:12px;margin-top:25px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:780px){.layout{grid-template-columns:1fr}.side{grid-row:2}.hero{padding:18px;min-height:140px}main{padding:0 12px 24px}header{padding:14px 12px}.panel{padding:13px}.cell .eq{font-size:clamp(11px,3.1vw,19px)}.board[data-size="5"] .eq{font-size:clamp(9px,2.6vw,16px)}.board[data-size="6"] .eq{font-size:clamp(8px,2.15vw,14px)}.board{gap:3px;border-width:3px}.hero-copy{max-width:70%}.hero-art{width:43%}.cell .mark{height:19px}.cell .mark svg{height:19px}.mission h2{font-size:17px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><a class="brand" href="./index.html">MATH ADVENTURE</a><a href="./index.html">← 返回首页</a></header>
<main>
<div class="hero"><div class="hero-copy"><div class="eyebrow">MISSION 01 · 数字峡谷</div><h1>冠军赛车挑战</h1><p>解开数字密码，穿越峡谷，赢得冠军奖杯。</p></div><svg class="hero-art" viewBox="0 0 340 165" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><circle cx="280" cy="36" r="25" fill="#f6ba55"/><path d="M0 125L75 44 135 110 200 38 340 135V165H0Z" fill="#d2a773"/><path d="M0 144Q70 83 145 126T340 101V165H0Z" fill="#8fa67c"/><path d="M-20 160Q95 95 185 152T355 118" fill="none" stroke="#485559" stroke-width="42"/><path d="M-20 160Q95 95 185 152T355 118" fill="none" stroke="#fff6df" stroke-width="3" stroke-dasharray="12 10"/><g transform="translate(115 85)"><ellipse cx="56" cy="50" rx="53" ry="7" fill="#243a4233"/><path d="M3 28L25 20 39 4H70L87 22 108 28V45H3Z" fill="#cb3037" stroke="#97272d" stroke-width="2"/><path d="M41 8H68L80 22H30Z" fill="#d9edf2"/><path d="M54 8V22" stroke="#97272d" stroke-width="3"/><path d="M9 30H102" stroke="#f77662" stroke-width="5"/><circle cx="25" cy="44" r="12" fill="#28343a"/><circle cx="85" cy="44" r="12" fill="#28343a"/><circle cx="25" cy="44" r="5" fill="#c9d0cf"/><circle cx="85" cy="44" r="5" fill="#c9d0cf"/><path d="M54 25h17v14H54z" fill="#fff9ed"/><text x="62" y="36" font-size="10" text-anchor="middle" font-weight="bold" fill="#a62f31">01</text></g><g transform="translate(292 60)"><path d="M0 0V65" stroke="#394a43" stroke-width="4"/><path d="M2 0H38V25H2Z" fill="#fffdf7"/><path d="M2 0H14V12H2ZM26 0H38V12H26ZM14 12H26V25H14Z" fill="#394a43"/></g></svg></div>
<div class="layout"><section class="panel game" aria-label="赛车迷宫">
<div class="mission"><div class="target"><small>通行密码</small><strong id="target">—</strong></div><div><h2>找到通往奖杯的路！</h2><p>只走方框答案等于通行密码的格子。每次只能上下左右移动一格。</p></div></div>
<div class="guide"><b>出发前练一练：</b> <span id="example"></span><br>答对也可能遇到死路，别着急，沿原路返回试试。</div>
<div id="board" class="board" aria-label="数字迷宫"></div>
<div class="legend"><span><i class="swatch start"></i>起点</span><span><i class="swatch green"></i>✓ 答对 / 已走路线</span><span><i class="swatch red"></i>× 答错</span><span><i class="swatch"></i>待探索</span></div>
<div id="feedback" class="feedback" role="status" aria-live="polite"><div id="message">准备出发！</div><div id="hintText" class="hint" hidden></div></div>
<div class="controls"><button class="btn" id="back">↶ 返回一步</button><button class="btn" id="hint">思考提示</button><button class="btn" id="restart">重玩本关</button></div>
</section><aside class="panel side"><h2>家长设置</h2><p>选好设置后，生成一张全新的迷宫。</p><label for="max">算术范围</label><select id="max"><option value="20">20 以内</option><option value="50">50 以内</option><option value="100" selected>100 以内</option></select><label for="size">迷宫大小</label><select id="size"><option value="4" selected>4 × 4（推荐）</option><option value="5">5 × 5</option><option value="6">6 × 6</option></select><label for="difficulty">干扰答案难度</label><select id="difficulty"><option value="easy">简单 · 差距较大</option><option value="medium" selected>进阶 · 数字接近</option><option value="hard">挑战 · 优先相差 1–2</option></select><label for="types">算术题型</label><select id="types"><option value="all" selected>混合（含未知数）</option><option value="basic">基础加减法</option><option value="unknown">未知数</option></select><button class="btn primary" id="new">生成新迷宫</button><div id="error" class="error" role="alert" hidden></div><p class="note">建议先用 4 × 4。难度主要控制干扰答案，题量较大时建议使用 100 以内。</p><div class="stats"><div><strong id="steps">0</strong>当前路线步数</div><div><strong id="tries">0</strong>尝试次数</div></div></aside></div>
<footer>Math Adventure · 赛车迷宫测试版 · 无需登录</footer>
</main>
<script src="math-generator.js"></script><script src="maze-generator.js"></script>
<script>
(() => {
'use strict';
const $=id=>document.getElementById(id);
const car='<svg viewBox="0 0 48 27" aria-hidden="true"><path d="M2 13L11 10 18 2H32L39 10 46 14V21H2Z" fill="#cd3438" stroke="#9c272b"/><path d="M19 4H31L36 10H14Z" fill="#cde7ee"/><path d="M25 4V10" stroke="#9c272b" stroke-width="2"/><circle cx="11" cy="21" r="5" fill="#2a383e"/><circle cx="37" cy="21" r="5" fill="#2a383e"/></svg>';
const trophy='<svg viewBox="0 0 40 30" aria-hidden="true"><path d="M11 4H29V13Q29 23 20 23T11 13Z" fill="#eab43a" stroke="#ac781a"/><path d="M11 7H5V11Q5 18 12 18M29 7H35V11Q35 18 28 18" fill="none" stroke="#c18c24" stroke-width="3"/><path d="M20 22V27M12 28H28" stroke="#ac781a" stroke-width="3"/><path d="M20 7L22 12 27 12 23 15 24 20 20 17 16 20 17 15 13 12 18 12Z" fill="#fff3bd"/></svg>';
let maze=null,route=[],wrong=-1,tries=0,level=0,hintCell=-1,won=false;
function say(text,kind=''){$('message').textContent=text;$('feedback').classList.toggle('correct',kind==='correct');$('feedback').classList.toggle('incorrect',kind==='incorrect');}
function clearHint(){level=0;hintCell=-1;$('hintText').hidden=true;$('hintText').textContent='';$('hint').textContent='思考提示';}
function render(){
 const at=route.at(-1), board=$('board');board.dataset.size=maze.size;board.style.gridTemplateColumns=`repeat(${maze.size},minmax(0,1fr))`;board.replaceChildren();
 const neighbors=MazeGenerator.neighbors(at,maze.size);
 maze.cells.forEach((q,i)=>{const b=document.createElement('button');b.type='button';b.className='cell';b.dataset.cell=i;
 if(route.includes(i))b.classList.add('trail');if(neighbors.includes(i)&&!won)b.classList.add('next');if(i===at)b.classList.add('current');if(i===maze.start)b.classList.add('start');if(i===wrong)b.classList.add('wrong');if(i===maze.end)b.classList.add('goal');
 const mark=document.createElement('span');mark.className='mark';if(i===at)mark.innerHTML=won?trophy:car;else if(i===maze.end)mark.innerHTML=trophy;else if(i===maze.start)mark.textContent='出发';else if(route.includes(i))mark.textContent='✓';if(i===at&&i!==maze.start){const result=document.createElement('span');result.className='result';result.textContent='✓';mark.append(result);}else if(i===wrong){const result=document.createElement('span');result.className='result';result.textContent='×';mark.append(result);}
 const eq=document.createElement('span');eq.className='eq';eq.textContent=q?q.text:(i===at?'起点':'START');b.append(mark,eq);b.setAttribute('aria-label',`第${Math.floor(i/maze.size)+1}行第${i%maze.size+1}列，${i===maze.end?'终点，':''}${q?q.text:'起点'}${i===at?'，赛车当前位置':''}${i===wrong?'，答案不正确':route.includes(i)&&i!==maze.start?'，答案正确':''}`);b.addEventListener('click',()=>move(i));board.append(b);});
 $('steps').textContent=route.length-1;$('tries').textContent=tries;$('back').disabled=won||route.length===1;$('hint').disabled=won;$('feedback').classList.toggle('win',won);
}
function move(i){if(won)return;const at=route.at(-1);if(!MazeGenerator.neighbors(at,maze.size).includes(i)){say('只能驶向上下左右紧挨着赛车的格子哦。');return;}clearHint();wrong=-1;
 if(route.includes(i)){route=route.slice(0,route.indexOf(i)+1);say('原路返回成功，再找找其他方向。');render();return;}
 tries++;if(maze.cells[i].answer!==maze.target){wrong=i;say('× 这个格子的答案不是通行密码。赛车没有移动，再算一算！','incorrect');render();return;}
 route.push(i);won=i===maze.end;if(won)say('🏆 冠军诞生！你找到通往奖杯的正确路线啦！','correct');else if(maze.deadEnds.includes(i))say('✓ 计算正确！可是这里走不通，返回一步试试另一条路。','correct');else say('✓ 计算正确！赛车向前行驶了一格。','correct');render();}
function reset(){route=[maze.start];wrong=-1;tries=0;won=false;clearHint();say('赛车准备好了！先算起点旁边的题目，再点击正确的格子。');render();}
function create(){const types={basic:['addition','subtraction'],unknown:['missing-addend','missing-minuend','missing-subtrahend']}[$('types').value];$('error').hidden=true;
 try{const next=MazeGenerator.generate({size:Number($('size').value),max:Number($('max').value),difficulty:$('difficulty').value,...(types?{types}:{})});if(!MazeGenerator.validate(next).valid)throw Error('迷宫验证失败');
 // Example must not reuse any mathematical relation already on the board.
 const used=new Set(next.cells.filter(Boolean).map(q=>q.key));let example;try{example=MathGenerator.generate(next.target,{max:next.max,used});}catch(e){example=null;}
 maze=next;$('target').textContent=maze.target;$('example').textContent=example?`${example.text}，方框里填 ${maze.target}，就能通过！`:`如果一个方框的答案是 ${maze.target}，就可以驶入。`;reset();}
 catch(e){$('error').hidden=false;$('error').textContent='暂时无法生成：'+e.message+'。可以扩大算术范围或缩小迷宫。';if(!maze)say('请调整家长设置后再试。');}}
 $('new').addEventListener('click',create);$('restart').addEventListener('click',()=>{if(maze)reset();});$('back').addEventListener('click',()=>{if(maze&&!won&&route.length>1)move(route.at(-2));});$('hint').addEventListener('click',()=>{if(!maze||won)return;const at=route.at(-1);if(level===0){hintCell=wrong>=0?wrong:MazeGenerator.neighbors(at,maze.size).find(i=>!route.includes(i)&&maze.cells[i]);level=1;}else level++;
 const q=maze.cells[hintCell];let text;if(!q)text='试着原路返回，看看有没有其他分岔。';else if(level===1)text=`看看 ${q.text}：${q.hint}`;else text=`${q.text} 中的方框是 ${q.answer}。${q.answer===maze.target?'这个格子可以走。':'它不是通行密码，试试其他格子。'}`;$('hintText').textContent=text;$('hintText').hidden=false;$('hint').textContent=level===1?'再提示一次':'思考提示';});
 if(typeof MathGenerator==='undefined'||typeof MazeGenerator==='undefined'){say('生成器没有加载成功。请检查三个文件是否位于同一目录。');$('new').disabled=true;$('restart').disabled=true;$('hint').disabled=true;$('back').disabled=true;}else create();
})();
</script>
</body></html>
